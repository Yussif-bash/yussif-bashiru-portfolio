<section class="py-12 px-6 md:px-16 bg-[#0f0f0f] text-white" id="contact">
  <div class="max-w-5xl mx-auto text-center">

    <!-- Section Title -->
    <h2 class="text-3xl md:text-4xl font-bold mb-12">
      Get in Touch
    </h2>

    <p class="text-gray-300 text-lg mb-12">
      I'm currently open to new opportunities. Whether you want to discuss a project, collaboration, or just say hi,
      feel free to reach out!
    </p>

    <!-- Contact Buttons -->
    <div class="flex flex-col sm:flex-row justify-center gap-6 mb-12">
      <a href="mailto:bashiruyussif87@gmail.com" class="contact-btn bg-indigo-600 hover:bg-indigo-700 transition">
        Email Me
      </a>
      <a href="https://linkedin.com/in/yussif-bashiru-alaska" target="_blank"
        class="contact-btn border border-gray-600 hover:border-indigo-500 hover:text-indigo-500 transition">
        LinkedIn
      </a>
      <a href="https://github.com/Alaska-gh" target="_blank"
        class="contact-btn border border-gray-600 hover:border-indigo-500 hover:text-indigo-500 transition">
        GitHub
      </a>
    </div>

    <!-- Optional Contact Form -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="max-w-xl mx-auto space-y-6 animate-fadeInUp">
      <input type="text" formControlName="name" placeholder="Your Name" class="contact-input w-full">
      <input type="email" formControlName="email" placeholder="Your Email" class="contact-input w-full">
      <textarea formControlName="message" placeholder="Your Message" class="contact-input w-full h-36"></textarea>

      <button type="submit" [disabled]="submitting" class="contact-btn bg-indigo-600 hover:bg-indigo-700 w-full">
        {{ submitting ? 'Sending...' : 'Send Message' }}
      </button>

      <p *ngIf="submitted" class="text-green-400">Thanks for reaching out — I'll get back to you soon.</p>
      <p *ngIf="submitError" class="text-red-400">Something went wrong — try again, or email me directly.</p>
    </form>

  </div>
</section>
