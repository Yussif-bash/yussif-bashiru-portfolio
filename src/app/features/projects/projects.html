<section class="py-16 px-6 relative bg-[#111111] text-white" id="projects">
  <h2 class="text-3xl font-bold text-center mb-10">Projects</h2>

  <div class="relative max-w-6xl mx-auto p-6">
    <!-- Prev button -->
    <button
      (click)="scrollByCard(-1)"
      aria-label="Previous project"
      class="hidden md:flex items-center justify-center absolute -left-5 top-1/2 -translate-y-1/2 z-10
             w-10 h-10 rounded-full bg-gray-900 border border-gray-700 hover:border-indigo-500 hover:text-indigo-500 transition">
      ‹
    </button>

    <!-- Track -->
    <div
      #track
      class="flex gap-6 overflow-x-auto snap-x snap-mandatory scroll-smooth no-scrollbar pb-4">
     <div
  *ngFor="let project of projects"
  class="project-card snap-center shrink-0 w-[75%] sm:w-[45%] lg:w-[30%]
         bg-gray-900 p-4 rounded-xl shadow-lg animate-fadeInUp flex flex-col">
  <img [src]="project.image" [alt]="project.title" class="rounded-lg mb-3 w-full h-36 object-fit">
  <h3 class="text-base font-semibold text-indigo-500 mb-1">{{ project.title }}</h3>
  <p class="text-gray-300 mb-3 text-xs line-clamp-2">{{ project.description }}</p>
  <div class="flex gap-1.5 flex-wrap mb-3">
    <span *ngFor="let tag of project.tags" class="tech-badge text-[10px] py-0.5 px-2">{{ tag }}</span>
  </div>
  <div class="flex gap-2 mt-auto">
    <a [href]="project.liveUrl" target="_blank"
       class="project-btn bg-indigo-600 hover:bg-indigo-700 transition px-3 py-1.5 rounded text-xs">Live Demo</a>
    <a [href]="project.githubUrl" target="_blank"
       class="project-btn border border-gray-600 hover:border-indigo-500 hover:text-indigo-500 transition px-3 py-1.5 rounded text-xs">GitHub</a>
  </div>
</div>
    </div>

    <!-- Next button -->
    <button
      (click)="scrollByCard(1)"
      aria-label="Next project"
      class="hidden md:flex items-center justify-center absolute -right-5 top-1/2 -translate-y-1/2 z-10
             w-10 h-10 rounded-full bg-gray-900 border border-gray-700 hover:border-indigo-500 hover:text-indigo-500 transition">
      ›
    </button>
  </div>
</section>
